name: weekly-analysis-to-discord

on:
  push:
    paths:
      - 'analyzer.ipynb'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4.2.2

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Jupyter & nbconvert
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert

      - name: 📝 Execute notebook & export to Markdown
        run: |
          mkdir -p tmp
          jupyter nbconvert \
            --to markdown --execute analyzer.ipynb \
            --output tmp/md-embed --embed-images
      
      - name: Debug
        run: |
            ls -lah tmp
            

      - name: 📂 Prepare Pages content
        run: |
          mkdir -p pages_root
          cp -R tmp pages_root/

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_root

      - name: 🚀 Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: 🔔 Notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          OWNER:        ${{ github.repository_owner }}
          REPO:         ${{ github.event.repository.name }}
        run: |
          # This matches the path you see on the Pages site:
          PAGES_URL="https://${OWNER}.github.io/${REPO}/tmp/md-embed_files/tmp"
          # Grab the first image filename from our local pages_root
          FIRST_IMG=$(ls pages_root/tmp/md-embed_files/tmp | head -n1)
          curl -H "Content-Type: application/json" \
               -d "{\"content\": \"${PAGES_URL}/${FIRST_IMG}\"}" \
               "${WEBHOOK_URL}"
