name: weekly-analysis-to-discord

on:
  push:
    paths:
      - 'analyzer.ipynb'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4.2.2

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Jupyter & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert requests

      - name: 📝 Execute notebook & export to Markdown
        run: |
          rm -rf tmp
          mkdir -p tmp
          jupyter nbconvert \
            --to markdown --execute analyzer.ipynb \
            --output tmp/md-embed --embed-images

      - name: 📂 Prepare Pages content
        run: |
          mkdir -p pages_root
          cp -R tmp pages_root/

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_root

      - name: 🚀 Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: 🔔 Notify Discord with all images
        shell: python
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          import os, json, requests

          owner = os.getenv("OWNER")
          repo = os.getenv("REPO")
          webhook_url = os.getenv("WEBHOOK_URL")
          base_url = f"https://{owner}.github.io/{repo}/tmp/md-embed_files/tmp"
          local_dir = "pages_root/tmp/md-embed_files/tmp"

          if not os.path.isdir(local_dir):
              raise FileNotFoundError(f"Directory not found: {local_dir}")

          files = sorted(os.listdir(local_dir))
          image_urls = [f"{base_url}/{f}" for f in files if f.lower().endswith(('.png', '.jpg', '.jpeg', '.gif', '.webp'))]
          content = "\n".join(image_urls) if image_urls else "⚠️ No image files found."

          print("Sending the following content to Discord:\n", content)

          r = requests.post(
              webhook_url,
              headers={"Content-Type": "application/json"},
              data=json.dumps({"content": content})
          )
          if r.status_code != 204:
              raise Exception(f"Discord webhook failed: {r.status_code}, {r.text}")

      - name: 🐞 Debug output
        run: |
          echo "::group::📁 tmp contents"
          find tmp
          echo "::endgroup::"

          echo "::group::📁 pages_root contents"
          find pages_root
          echo "::endgroup::"

          echo "::group::🖼️ Sample image URLs"
          for f in $(ls pages_root/tmp/md-embed_files/tmp | head -n 5); do
            echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tmp/md-embed_files/tmp/$f"
          done
          echo "::endgroup::"
