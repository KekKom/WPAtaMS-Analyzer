name: weekly-analysis-to-discord

on:
  push:
    paths:
      - 'analyzer.ipynb'
      - '.github/workflows/weekly-analysis-to-discord.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Jupyter & nbconvert
        run: |
          pip install --upgrade pip
          pip install jupyter nbconvert

      - name: Execute notebook & export
        run: |
          mkdir -p tmp
          jupyter nbconvert --to markdown --execute analyzer.ipynb \
            --output tmp/md-embed --embed-images

      - name: Prepare Pages content
        run: |
          mkdir -p pages_root
          cp -R tmp pages_root/

      - name: Upload to GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_root

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          PAGES_URL="https://${OWNER}.github.io/${REPO}/tmp/md-embed_files/tmp"
          FIRST_IMG=$(ls tmp/md-embed_files/tmp | head -n1)
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"${PAGES_URL}/${FIRST_IMG}\"}" \
            "${WEBHOOK_URL}"
