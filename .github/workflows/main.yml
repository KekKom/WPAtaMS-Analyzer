# .github/workflows/weekly-analysis.yml
name: weekly-analysis-to-discord

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
# ──────────────────────────────────────────────────────────
# 1) BUILD the notebook, create out.html, upload as artifact
# ──────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Execute notebook → MD
        run: |
          pip install nbconvert jupyterlab
          mkdir tmp
          jupyter nbconvert --to markdown --execute analyzer.ipynb \
                            --output tmp/out \
                            --embed-images          # inline all plots
      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report              # artifact name
          path: tmp                   # single file
# ──────────────────────────────────────────────────────────
# 2) ANNOUNCE: download artifact and post to Discord
# ──────────────────────────────────────────────────────────
  announce:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: weekly-report              # same name as upload
          path: tmp                          # saves out.html here

      # ── makepost: send the file or inline block ─────────
      - name: makepost – send to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          ls -lh tmp
