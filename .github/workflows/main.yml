name: weekly-analysis-to-discord
on:
  push:
    # run when you update your notebook, your dependencies, or this workflow
    paths:
      - 'analyzer.ipynb'
      - 'requirements.txt'
      - '.github/workflows/deploy-images.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter nbconvert
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Execute notebook & export
        run: |
          # create tmp/ on the fly
          mkdir -p tmp
          jupyter nbconvert --to markdown --execute analyzer.ipynb \
            --output tmp/md-embed --embed-images

      - name: Prepare Pages content
        run: |
          mkdir -p pages_root
          cp -R tmp pages_root/

      - name: Upload to GitHub Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: pages_root

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1

      - name: Notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          PAGES_URL="https://${OWNER}.github.io/${REPO}/tmp/md-embed_files/tmp"
          FIRST_IMG=$(ls tmp/md-embed_files/tmp | head -n1)
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"${PAGES_URL}/${FIRST_IMG}\"}" \
            "${WEBHOOK_URL}"
